name: Node checks

on:
  push:
    branches:
      - main
      - feature/mysql-runtime-migration
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Syntax-check application and migration scripts
        run: |
          find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check server.js
          node --check migrate.js
      - name: Run unit tests
        run: npm test
